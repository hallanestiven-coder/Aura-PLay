<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Play - Music Player</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <main class="main-content">
      <section id="now-playing" class="page active">
        <div class="center-stage">
          <div class="ambient ambient-1"></div>
          <div class="ambient ambient-2"></div>

          <div class="brand-visual" aria-hidden="true">
            <div class="ring ring-left"></div>
            <div class="ring ring-right"></div>
            <div class="music-note">
              <span class="note-head"></span>
              <span class="note-stem"></span>
              <span class="note-tail"></span>
            </div>
          </div>

          <h1 class="brand-title">Aura Play</h1>

          <div class="song-info">
            <h3 id="song-title">No Song Playing</h3>
            <p id="song-artist">Select a folder to get started</p>
          </div>

          <div class="progress-section">
            <div class="time" id="current-time">0:00</div>
            <input
              type="range"
              id="progress-bar"
              class="progress-bar"
              min="0"
              max="100"
              value="0"
            />
            <div class="time" id="duration">0:00</div>
          </div>

          <div class="controls">
            <button id="prev-btn" class="btn btn-control">⏮️</button>
            <button id="play-btn" class="btn btn-control btn-play">▶️</button>
            <button id="next-btn" class="btn btn-control">⏭️</button>
          </div>

          <div class="volume-control">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="70" />
            <span id="volume-percent">70%</span>
          </div>

          <button id="select-folder-btn" class="btn btn-open-folder">📁 Open Music Folder</button>
        </div>
      </section>

      <section id="playlist" class="page">
        <div class="content-panel">
          <h2>Current Playlist</h2>
          <div class="playlist-container" id="playlist-container">
            <p class="empty-state">No songs in playlist</p>
          </div>
        </div>
      </section>

      <section id="library" class="page">
        <div class="content-panel">
          <h2>Music Library</h2>
          <div class="library-container" id="library-container">
            <p class="empty-state">No music folder selected</p>
          </div>
        </div>
      </section>
    </main>

    <nav class="nav-bar">
      <button class="nav-btn active" data-page="now-playing">Now Playing</button>
      <button class="nav-btn" data-page="playlist">Playlist</button>
      <button class="nav-btn" data-page="library">Library</button>
    </nav>
  </div>

  <audio id="audio-player"></audio>

  <script src="./renderer.js"></script>
</body>
</html>
