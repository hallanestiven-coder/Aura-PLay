name: Build Windows  on:   push:     branches: [ main ]   pull_request:     branches: [ main ]   workflow_dispatch:  jobs:   build-windows:     name: Build on Windows     runs-on: windows-latest      steps:       - name: Checkout repository         uses: actions/checkout@v4        - name: Setup Node.js         uses: actions/setup-node@v4         with:           node-version: '18'        - name: Install dependencies         run: |           npm ci        - name: Build project         run: |           npm run build        - name: Run tests         run: |           npm test        - name: Archive build artifacts         if: success()         uses: actions/upload-artifact@v4         with:           name: windows-build-artifacts           path: |             dist/**             build/**        - name: Upload coverage (optional)         if: success() && steps.install.outcome == 'success'         run: |           echo "No coverage step configured; add your upload here if needed"

